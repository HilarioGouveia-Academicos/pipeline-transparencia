services:
  db:
    image: postgres:15
    container_name: transparencia_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE:-transparencia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-transparencia}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: transparencia_app
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-transparencia}
      - ANO=${ANO:-2025}
      - TAMANHO_BLOCO=${TAMANHO_BLOCO:-50000}
    ports:
      - "${APP_PORT:-8501}:8501"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: streamlit run app/app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  db_data: